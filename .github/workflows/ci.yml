name: CI / Quality & Intelligence Verification

on:
  push:
    branches: [main, feat/*, feat/**]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Typecheck, Unit/Integration Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Security & Zero-Secret Tests
        run: npm run test:security

      - name: Run API Contract & Webhook Tests
        run: npm run test:contracts

      - name: Run Integration & Resilience Tests
        run: npm run test:integration

      - name: Run End-to-End Workflow Tests
        run: npm run test:e2e

      - name: Run AI Quality & Regression Gates
        run: npm run test:eval

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
