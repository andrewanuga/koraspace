# /etc/nginx/sites-available/koraspace
# KoraSpace — Nginx reverse proxy with security hardening
# Replace YOUR_DOMAIN with your actual domain name.

# ── Rate limiting zones ──────────────────────────────────────────────────────
# (Define these in /etc/nginx/nginx.conf http{} block or include this file there)
limit_req_zone $binary_remote_addr zone=koraspace_global:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=koraspace_api:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=koraspace_auth:10m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=koraspace_conn:10m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ── TLS (managed by Certbot) ─────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Modern TLS only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── OCSP stapling ────────────────────────────────────────────
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Security headers (belt-and-suspenders with Next.js) ──────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Connection limits ────────────────────────────────────────
    limit_conn koraspace_conn 20;

    # ── CrowdSec bouncer ─────────────────────────────────────────
    # The crowdsec-nginx-bouncer sets this up automatically via its
    # /etc/crowdsec/bouncers/crowdsec-nginx-bouncer.conf config.
    # Uncomment the line below if using the LUA bouncer directly:
    # access_by_lua_file /usr/lib/crowdsec/lua/crowdsec.lua;

    # ── Coraza WAF (Nginx + ModSecurity-compatible) ───────────────
    # Requires the ModSecurity Nginx module compiled with Coraza.
    # modsecurity on;
    # modsecurity_rules_file /etc/coraza/coraza.conf;

    # ── Proxy to Next.js ─────────────────────────────────────────
    location / {
        limit_req zone=koraspace_global burst=20 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Client-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Stricter limits on API routes ────────────────────────────
    location /api/ {
        limit_req zone=koraspace_api burst=10 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Client-IP $remote_addr;
        proxy_read_timeout 120s;  # AI routes may need more time
    }

    # ── Auth routes — very tight limits ──────────────────────────
    location ~ ^/api/(auth|billing/checkout) {
        limit_req zone=koraspace_auth burst=5 nodelay;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Client-IP $remote_addr;
    }

    # ── Webhook endpoints — no rate limit (Paystack needs to call freely) ──
    location /api/billing/webhook {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Client-IP $remote_addr;
    }

    # ── Static assets — long cache ────────────────────────────────
    location /_next/static/ {
        proxy_pass      http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Block common attack paths ─────────────────────────────────
    location ~* \.(php|aspx|asp|cgi|pl|py|rb|sh)$ { return 404; }
    location ~ /\. { deny all; }
    location = /wp-login.php { return 404; }
    location = /xmlrpc.php   { return 404; }
    location = /wp-admin     { return 404; }

    # ── Payload size limits ───────────────────────────────────────
    client_max_body_size 10m;  # Generous for file uploads via repurpose feature
}
